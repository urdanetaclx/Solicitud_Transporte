<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solicitud de Servicio de Transporte</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #25D366; color: white; padding: 10px 15px; border: none; font-size: 16px; cursor: pointer; font-weight: bold; border-radius: 5px; }
    button:hover { background-color: #128C7E; }
  </style>
</head>
<body>

  <h2>Solicitud de Servicio de Transporte</h2>

  <div class="form-group">
    <label>Fecha:</label>
    <input type="text" id="fecha" placeholder="Ej: 25 de agosto 2026">
  </div>
  <div class="form-group">
    <label>Hora de Inicio:</label>
    <input type="text" id="horaInicio" placeholder="Ej: 8:00 am">
  </div>
  <div class="form-group">
    <label>Hora de Fin:</label>
    <input type="text" id="horaFin" placeholder="Ej: 4:00 pm">
  </div>
  <div class="form-group">
    <label>Institución o Gerencia:</label>
    <input type="text" id="institucion" placeholder="Ej: Hermandad de Samuel...">
  </div>
  <div class="form-group">
    <label>Descripción de Actividad:</label>
    <textarea id="descripcion" rows="3"></textarea>
  </div>
  <div class="form-group">
    <label>Lugar:</label>
    <input type="text" id="lugar" placeholder="Ej: Cabimas, Parroquia Ambrosio">
  </div>
  <div class="form-group">
    <label>Dirección Exacta:</label>
    <input type="text" id="direccion">
  </div>
  <div class="form-group">
    <label>Casa / Referencia:</label>
    <input type="text" id="casa">
  </div>
  <div class="form-group">
    <label>Equipo Requerido:</label>
    <input type="text" id="equipo">
  </div>
  <div class="form-group">
    <label>Responsable:</label>
    <input type="text" id="responsable">
  </div>
  <div class="form-group">
    <label>Teléfono del Responsable:</label>
    <input type="text" id="telResponsable" placeholder="Ej: 0412-1656176">
  </div>
  <div class="form-group">
    <label>Teléfonos de Contacto Adicionales:</label>
    <input type="text" id="telContacto" placeholder="Ej: Álvaro Contreras 0416-5610729">
  </div>

  <button onclick="enviarWhatsApp()">Enviar por WhatsApp</button>

  <script>
    function enviarWhatsApp() {
      // Reemplazar con el número del administrador en formato internacional (sin el + ni espacios)
      const numeroAdmin = "584166609212"; 

      const fecha = document.getElementById('fecha').value;
      const horaInicio = document.getElementById('horaInicio').value;
      const horaFin = document.getElementById('horaFin').value;
      const institucion = document.getElementById('institucion').value;
      const descripcion = document.getElementById('descripcion').value;
      const lugar = document.getElementById('lugar').value;
      const direccion = document.getElementById('direccion').value;
      const casa = document.getElementById('casa').value;
      const equipo = document.getElementById('equipo').value;
      const responsable = document.getElementById('responsable').value;
      const telResponsable = document.getElementById('telResponsable').value;
      const telContacto = document.getElementById('telContacto').value;

      const mensaje = `*Datos para solicitud de Servicios de Transporte*

*Fecha:* ${fecha}
*Hora de inicio:* ${horaInicio}
*Hora de Fin:* ${horaFin}

*Institución o gerencia:* ${institucion}

*Descripción de Actividad:* ${descripcion}

*Lugar:* ${lugar}
*Dirección Exacta:* ${direccion}
*Casa:* ${casa}

*Equipo Requerido:* ${equipo}

*Responsable:* ${responsable}
*Teléfono:* ${telResponsable}

*Teléfonos de contacto:* ${telContacto}`;

      const url = `https://wa.me/${numeroAdmin}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
